name: Build & Release Pong Game

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. TEST & CODE QUALITY
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cp .env.example .env || copy .env.example .env || true
          flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # 2. ANDROID BUILD
  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cp .env.example .env || copy .env.example .env || true
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PongGame-Android-Release
          path: build/app/outputs/flutter-apk/app-release.apk

  # 3. IOS BUILD (Archive)
  build-ios:
    name: Build iOS Archive
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cp .env.example .env || copy .env.example .env || true
          flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Payload
        uses: actions/upload-artifact@v4
        with:
          name: PongGame-iOS-Release
          path: build/ios/iphoneos

  # 4. WEB BUILD
  build-web:
    name: Build Web App
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cp .env.example .env || copy .env.example .env || true
          flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href "/"

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PongGame-Web-Release
          path: build/web

  # 5. WINDOWS BUILD (Inno Setup Universal Installer - x64 & ARM64)
  build-windows:
    name: Build Windows Universal Installer (x64 & ARM64)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: |
          cp .env.example .env || copy .env.example .env || true
          flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Inno Setup Universal Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer/pong_game_setup.iss

      - name: Upload Windows Universal Setup
        uses: actions/upload-artifact@v4
        with:
          name: ThePongGame-Windows-Universal-Setup
          path: build/windows/installer/ThePongGame-Setup.exe

  # 6. MACOS BUILD (Universal DMG Installer & Notarization)
  build-macos:
    name: Build macOS Universal DMG
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: |
          cp .env.example .env || true
          flutter pub get

      - name: Build macOS Universal Release
        run: flutter build macos --release

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Code Signing (Developer ID or Ad-hoc)
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: "temporary-keychain-pass"
        run: |
          APP_PATH="build/macos/Build/Products/Release/pong_game.app"
          
          if [ -n "$CERTIFICATE_BASE64" ] && [ -n "$CERTIFICATE_PASSWORD" ]; then
            echo "Importing Apple Developer ID Certificate..."
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            CERT_PATH=$RUNNER_TEMP/certificate.p12
            echo "$CERTIFICATE_BASE64" | base64 --decode > $CERT_PATH
            security import $CERT_PATH -k $KEYCHAIN_PATH -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            
            IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
            echo "Signing with identity: $IDENTITY"
            
            codesign --deep --force --verify --verbose --options runtime \
              --entitlements macos/Runner/Release.entitlements \
              --sign "$IDENTITY" "$APP_PATH"
          else
            echo "No Apple Certificate secret provided. Performing Ad-hoc signing for Universal DMG..."
            codesign --force --deep -s - "$APP_PATH"
          fi

      - name: Package Universal DMG
        run: |
          mkdir -p build/macos/dmg
          DMG_OUTPUT="build/macos/dmg/ThePongGame-macOS-Universal.dmg"
          APP_PATH="build/macos/Build/Products/Release/pong_game.app"

          test -f "$DMG_OUTPUT" && rm "$DMG_OUTPUT"
          create-dmg \
            --volname "The Pong Game" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "pong_game.app" 180 170 \
            --hide-extension "pong_game.app" \
            --app-drop-link 480 170 \
            "$DMG_OUTPUT" \
            "$APP_PATH" || {
              echo "create-dmg completed or requires fallback..."
              if [ ! -f "$DMG_OUTPUT" ]; then
                echo "Fallback to native hdiutil..."
                TMP_DMG_DIR=$RUNNER_TEMP/dmg_content
                mkdir -p $TMP_DMG_DIR
                cp -R "$APP_PATH" $TMP_DMG_DIR/
                ln -s /Applications $TMP_DMG_DIR/Applications
                hdiutil create -volname "The Pong Game" -srcfolder $TMP_DMG_DIR -ov -format UDZO "$DMG_OUTPUT"
              fi
            }

      - name: Notarize DMG (Optional with Apple Secrets)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          DMG_OUTPUT="build/macos/dmg/ThePongGame-macOS-Universal.dmg"
          
          if [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            echo "Notarizing with App Store Connect API Key..."
            KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8
            echo "$APPLE_API_PRIVATE_KEY" > $KEY_PATH
            xcrun notarytool submit "$DMG_OUTPUT" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --key "$KEY_PATH" --wait
            xcrun stapler staple "$DMG_OUTPUT"
            echo "Notarization and stapling complete!"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Notarizing with Apple ID and App-Specific Password..."
            xcrun notarytool submit "$DMG_OUTPUT" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$DMG_OUTPUT"
            echo "Notarization and stapling complete!"
          else
            echo "Skipping Apple Notarization (No Apple credentials configured in repository secrets)."
            echo "The Universal DMG is ready for distribution!"
          fi

      - name: Upload macOS Universal DMG
        uses: actions/upload-artifact@v4
        with:
          name: ThePongGame-macOS-Universal-DMG
          path: build/macos/dmg/ThePongGame-macOS-Universal.dmg

