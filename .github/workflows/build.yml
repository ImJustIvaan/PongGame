name: Build & Release Pong Game

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. TEST & CODE QUALITY
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cp .env.example .env || copy .env.example .env || true
          flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # 2. ANDROID BUILD
  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cp .env.example .env || copy .env.example .env || true
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PongGame-Android-Release
          path: build/app/outputs/flutter-apk/app-release.apk

  # 3. IOS BUILD (Archive)
  build-ios:
    name: Build iOS Archive
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cp .env.example .env || copy .env.example .env || true
          flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Payload
        uses: actions/upload-artifact@v4
        with:
          name: PongGame-iOS-Release
          path: build/ios/iphoneos

  # 4. WEB BUILD
  build-web:
    name: Build Web App
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cp .env.example .env || copy .env.example .env || true
          flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href "/"

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PongGame-Web-Release
          path: build/web

  # 5. WINDOWS BUILD (Inno Setup Universal Installer - x64 & ARM64)
  build-windows:
    name: Build Windows Universal Installer (x64 & ARM64)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: |
          cp .env.example .env || copy .env.example .env || true
          flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Inno Setup Universal Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer/pong_game_setup.iss

      - name: Upload Windows Universal Setup
        uses: actions/upload-artifact@v4
        with:
          name: ThePongGame-Windows-Universal-Setup
          path: build/windows/installer/ThePongGame-Setup.exe
